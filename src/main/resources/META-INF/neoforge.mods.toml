[[mods]]
modId="omnilogistics"
version="0.2.0"
displayName="OmniLogistics"
authors="mertokan"
logoFile="logo.png"
credits="Built against NeoForge capabilities only, so it works with AE2, Mekanism and Actually Additions without depending on any of them."
description='''One card system for every machine in your pack.

Bind a Logistics Card to any block by sneak-clicking it, drop the card into a pipe, a Wireless Router or a Batch
Distributor, and the mod finds the working face of that machine by itself - no side configuration, on any mod's block.
Filter by item, tag, enchantment or any data component, pick your own tick rate from 1 to 200, and move items, FE and
fluids across dimensions.'''

